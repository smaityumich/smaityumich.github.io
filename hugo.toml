baseURL = "https://smaityumich.github.io/"
locale = "en-US"
title = "Subha Maity"
theme = "beautifulhugo"
enableRobotsTXT = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[Params]
  subtitle = "Statistics, machine learning, and transfer learning"
  description = "Subha Maity is an Assistant Professor at the University of Waterloo working on the statistical foundations of machine learning, transfer learning, and distribution shift."
  mainSections = ["post", "posts"]
  logo = "/img/headshot.jpg"
  favicon = "/img/favicon.ico"
  images = ["/img/og-card.jpg"]
  shareImage = "/img/og-card.jpg"
  dateFormat = "January 2, 2006"
  colorScheme = "light"
  readingTime = true
  socialShare = false
  showRelatedPosts = false
  rss = false
  mathEngine = "none"

  [Params.search]
    provider = "none"

[Params.author]
  name = "Subha Maity"
  github = "smaityumich"
  website = "https://smaityumich.github.io/"
  googlescholar = "https://scholar.google.com/citations?user=eD9vCGMAAAAJ&hl=en"

[markup.highlight]
  noClasses = false

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

